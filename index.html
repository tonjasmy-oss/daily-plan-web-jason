<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
  <meta name="theme-color" content="#0A0D3A">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>工程管理系统</title>
<link rel="stylesheet" href="assets/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Hanken+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  body { background: var(--bg); color: var(--text); }
  .boot-card {
    font-family: var(--font-sans);
    max-width: 560px; margin: 60px auto; padding: 28px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-card); line-height: 1.7;
  }
  .boot-card .boot-title {
    font-size: 18px; font-weight: 600; color: var(--danger); margin-bottom: 12px;
  }
  .boot-card code {
    background: var(--bg-elevated); padding: 2px 8px; border-radius: 4px;
    font-family: var(--font-mono); color: var(--primary-light); font-size: 12px;
  }
  .boot-card ul { margin: 8px 0; padding-left: 24px; }
  .boot-card a.boot-link {
    display: inline-block; margin-top: 12px;
    color: var(--primary-light); font-weight: 500;
  }
</style>
<script>
  /* 检测是否通过 file:// 直接打开（双击 HTML 会导致 fetch 被浏览器拒绝） */
  if (location.protocol === 'file:') {
    document.body.innerHTML =
      '<div class="boot-card">' +
      '<div class="boot-title">⚠ 打开方式错误</div>' +
      '检测到您是通过 <code>file://</code> 协议直接打开的页面（双击了 HTML 文件）。<br>' +
      '浏览器会阻止此协议下的网络请求，所以无法连接服务器。<br><br>' +
      '<b>正确方式：</b>先启动后端服务，再通过浏览器访问 <code>http://localhost:8080</code>。<br><br>' +
      '启动方式（任选其一）：' +
      '<ul>' +
      '<li>双击 <code>start.bat</code>（Windows）</li>' +
      '<li>命令行：<code>python server/app.py</code></li>' +
      '<li>Linux/macOS：<code>./start.sh</code></li>' +
      '</ul>' +
      '<a class="boot-link" href="http://localhost:8080">→ 访问 http://localhost:8080</a>' +
      '</div>';
  } else {
    /* 入口：向服务器查询登录会话，未登录跳登录页，已登录跳仪表盘 */
    fetch('/api/me', { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res && res.user) {
          localStorage.setItem('eng_ms_current_user_v1', JSON.stringify(res.user._id));
          location.href = 'dashboard.html';
        } else {
          location.href = 'login.html';
        }
      })
      .catch(function () { location.href = 'login.html'; });
  }
</script>
</head>
<body></body>
</html>
